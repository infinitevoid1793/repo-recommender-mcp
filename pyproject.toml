[project]
name = "repo-recommender-mcp"
version = "1.0.0"
description = "Local MCP server that recommends GitHub repos and issues worth contributing to"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=2",
    "requests",
    "pyyaml",
    "duckdb",
    "python-dotenv",
    "typing-extensions",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "build"]

[project.scripts]
repo-recommender = "repo_recommender.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repo_recommender"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Pinned explicitly so a ruff upgrade can't fail CI on newly added rules.
select = ["E", "F", "I", "UP", "B", "SIM"]
